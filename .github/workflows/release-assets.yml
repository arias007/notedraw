name: release-assets

# 发版三件套自动上传。
# 为什么需要它：本机到 uploads.github.com 的 TLS 被 SNI 层 RST（TLS 分片也无效），
# Release 附件从手机/沙箱永远传不上去。Actions runner 在 GitHub 内网，不受影响。
#
# 用法：
#   gh workflow run release-assets.yml -f version=4.1.3
#   或 POST /repos/{owner}/{repo}/actions/workflows/release-assets.yml/dispatches

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，纯数字，不带 v（例：4.1.3）"
        required: true
      ref:
        description: "构建用的 git ref（留空=用同名 tag）"
        required: false
        default: ""
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: 解析 ref 与版本
        id: r
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ]; then VER="${GITHUB_REF_NAME}"; fi
          REF="${{ inputs.ref }}"
          if [ -z "$REF" ]; then REF="$VER"; fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "resolved version=$VER ref=$REF"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.r.outputs.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 构建
        run: npm run build

      - name: 校验版本号与产物
        env:
          VER: ${{ steps.r.outputs.version }}
        run: |
          node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync("manifest.json","utf8"));if(m.version!==process.env.VER){console.error("manifest.version="+m.version+" != "+process.env.VER);process.exit(1)}console.log("manifest.version OK: "+m.version)'
          node --check main.js
          ls -l main.js manifest.json styles.css
          sha256sum main.js manifest.json styles.css

      - name: 上传三件套
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ steps.r.outputs.version }}
        run: |
          set -e
          if gh release view "$VER" >/dev/null 2>&1; then
            echo "release $VER 已存在，改为上传附件"
          else
            gh release create "$VER" --title "$VER" --verify-tag \
              --notes "NoteDraw $VER"
          fi
          gh release upload "$VER" main.js manifest.json styles.css --clobber
          echo "--- 最终附件 ---"
          gh release view "$VER" --json tagName,name,assets \
            --jq '"tag=\(.tagName) name=\(.name)", (.assets[] | "  \(.name) \(.size) bytes  \(.url)")'
